name: Lunafy Auto Renew

on:
  schedule:
    # 每天 UTC 0点、6点、12点、18点执行 (每 6 小时检查一次)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 测试

# 赋予删除工作流运行记录和缓存的写权限
permissions:
  contents: read
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Auto Renew Script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.js

      # 步骤 1：清理 GitHub Actions 所有缓存
      - name: Clean Actions Cache
        if: always()
        run: |
          echo "Cleaning repository actions cache..."
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          gh actions-cache delete --all --confirm 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      # 步骤 2：清理旧的工作流记录（仅保留最后 1 条）
      - name: Delete Old Workflow Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_minimum_runs: 1
          keep_minimum_runs: 1
