name: FenixHost Auto Renew

on:
  workflow_dispatch:
    # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          python -m playwright install chromium --with-deps

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Run FenixHost Renew
        env:
          # 单账号
          FENIX_COOKIE: ${{ secrets.FENIX_COOKIE }}
          FENIX_SERVICE_IDS: ${{ vars.FENIX_SERVICE_IDS }}

          # 通用配置
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          # 代理（可选）：若配置了 NODE_LINK，setup_proxy.sh 会启动 sing-box，
          # 脚本会自动检测本地代理端口；也可用 FENIX_PROXY 显式指定
          FENIX_PROXY: ${{ secrets.FENIX_PROXY }}
        run: python fenixhost_renew.py
