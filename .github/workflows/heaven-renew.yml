name: HeavenCloud Auto Renew

on:
  schedule:
    # 每天 UTC 02:00 与 14:00 (北京时间 10:00 与 22:00) 自动执行
    - cron: '0 2,14 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖与浏览器内核
        run: |
          npm init -y
          npm install playwright yaml
          npx playwright install chromium --with-deps

      - name: 清理旧进程与启动多协议代理 (Mihomo)
        env:
          heaven_PROXY_CONFIG: ${{ secrets.heaven_PROXY_CONFIG }}
        run: |
          node heaven-renew.js --setup-proxy

      - name: 执行自动化续期脚本
        env:
          SERVER_URL: "https://control.heavencloud.in/server/d9063afd/overview"
          heavencookies: ${{ secrets.heavencookies }}
          heaven_PROXY_CONFIG: ${{ secrets.heaven_PROXY_CONFIG }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          node heaven-renew.js

      - name: 自动更新覆写 Secrets 中的 heavencookies
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f "new_cookies.json" ] && [ -n "$GH_TOKEN" ]; then
            echo "[*] 检测到新 Cookies，正在通过 GitHub CLI 写回 Secrets.heavencookies..."
            gh secret set heavencookies --repo "${{ github.repository }}" < new_cookies.json
            echo "[+] heavencookies 自动更新覆写成功！"
          else
            echo "[*] 跳过更新: 未生成 new_cookies.json 或未配置 GH_PAT。"
          fi

      - name: 上传执行现场截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-screenshot
          path: |
            *.png
          retention-days: 3

      - name: 强制清理残留进程与临时缓存
        if: always()
        run: |
          node heaven-renew.js --clean
