name: Auto renew mws

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每三天一续 UTC 0:00（北京时间 8:00）
  workflow_dispatch:

jobs:
  Renew-mws:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        if: env.NODE_LINK != ''
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh) || true

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MWS_COOKIES: ${{ secrets.MWS_COOKIES }}
          IS_PROXY: ${{ secrets.NODE_LINK != '' }}
          HEADLESS: "true"
        run: |
          xvfb-run --auto-servernum python3 mwsrenew.py

      - name: 💾 更新 Cookies 到 Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f "cookies.json" ] && [ -s "cookies.json" ]; then
            echo "检测到 cookies.json，正在通过 GH_PAT 更新 MWS_COOKIES Secret..."
            gh secret set MWS_COOKIES < cookies.json
            echo "✅ MWS_COOKIES 已成功覆盖保存"
          else
            echo "ℹ️ 本次未生成有效 cookies.json，跳过更新"
          fi

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log cookies.json || true

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
