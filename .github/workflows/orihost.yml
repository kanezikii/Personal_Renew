name: Orihost Monitor & Alert

on:
  schedule:
    - cron: '0 10 */3 * *'  # 每天北京时间 12:00 自动运行
  workflow_dispatch:      # 支持手动一键触发

jobs:
  check-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Run Server Monitor (with Xvfb)
        env:
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          ORIHOST_SERVER_IDS: ${{ vars.ORIHOST_SERVER_IDS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ORIHOST_PROXY: http://127.0.0.1:1081
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python orihost-renew.py

      - name: 📸 上传监控截图 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orihost-status-screenshots
          path: screenshots/
          retention-days: 7
