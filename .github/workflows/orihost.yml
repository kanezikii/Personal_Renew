name: Orihost Auto Renew (Playwright)

on:
  schedule:
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Run Playwright Renew
        env:
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          ORIHOST_SERVER_IDS: ${{ vars.ORIHOST_SERVER_IDS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ORIHOST_PROXY: http://127.0.0.1:1081
        run: python orihost-renew.py

      - name: 📸 上传运行过程截图 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orihost-screenshots
          path: screenshots/
          retention-days: 7
